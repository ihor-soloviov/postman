# /etc/nginx/sites-available/postman  → symlink у sites-enabled
# HTTPS обов'язковий: без нього не працюють ні service worker (офлайн),
# ні геолокація в браузері. Сертифікат: certbot --nginx -d postman.example.com

server {
    listen 80;
    server_name postman.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name postman.example.com;

    ssl_certificate     /etc/letsencrypt/live/postman.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/postman.example.com/privkey.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Незмінна статика Next — кешуємо назавжди
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
